services:
  postgres:
    image: postgres:16-alpine
    container_name: supplyguard-postgres
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-supplyguard}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-123456}
      POSTGRES_DB: ${APP_POSTGRES_DB:-supplyguard}
    # 映射到 5433：本机已有 PostgreSQL 占用 5432
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-supplyguard}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: supplyguard-redis
    # 映射到 6380：本机 6379 已被其他 Redis 占用
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.20.0
    container_name: supplyguard-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/data
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26-community
    container_name: supplyguard-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      # 用户名固定 neo4j，密码取根目录 .env，未配置时用默认值
      NEO4J_AUTH: neo4j/${APP_NEO4J_PASSWORD:-change-me}
      # 演示规模很小，堆和页缓存按最小可用配置给
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes:
      - neo4j-data:/data
    restart: unless-stopped

  backend:
    build: .
    container_name: supplyguard-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      neo4j:
        condition: service_started
    environment:
      APP_DATABASE_URL: postgresql+psycopg://${APP_POSTGRES_USER:-supplyguard}:${APP_POSTGRES_PASSWORD:-123456}@postgres:5432/${APP_POSTGRES_DB:-supplyguard}
      APP_REDIS_URL: redis://redis:6379/0
      APP_QDRANT_URL: http://qdrant:6333
      APP_NEO4J_URI: bolt://neo4j:7687
      APP_NEO4J_USER: neo4j
      APP_NEO4J_PASSWORD: ${APP_NEO4J_PASSWORD:-change-me}
      APP_NEO4J_DATABASE: ${APP_NEO4J_DATABASE:-neo4j}
      APP_JWT_SECRET_KEY: ${APP_JWT_SECRET_KEY:-change-me-in-production}
      APP_DEMO_PASSWORD: ${APP_DEMO_PASSWORD:-catl123}
      APP_EMBEDDING_API_KEY: ${APP_EMBEDDING_API_KEY:-}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-text-embedding-v3}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-1024}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-https://api.deepseek.com/v1}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    volumes:
      - uploads:/app/data/uploads
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
  neo4j-data:
  uploads: